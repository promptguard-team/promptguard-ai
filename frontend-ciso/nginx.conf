server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = / {
        return 302 /ciso/;
    }

    # History-mode SPA under /ciso/: unknown paths fall back to the app shell.
    location /ciso/ {
        try_files $uri $uri/ /ciso/index.html;
    }

    # The shell must be revalidated so a deploy never serves stale asset hashes.
    location = /ciso/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Hashed build output; a location-level add_header replaces the server-level ones.
    location /ciso/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
