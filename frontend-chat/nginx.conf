server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # History-mode SPA: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
