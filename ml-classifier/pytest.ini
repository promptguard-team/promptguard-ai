[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
; `error` makes any warning not explicitly ignored below fail the suite.
; Every entry below is a *known* third-party deprecation, pinned by message,
; category, and source module so an unrelated warning cannot slip through.
filterwarnings =
    error
    ; fastapi 0.115.6's own route-registration code calls the deprecated
    ; asyncio.iscoroutinefunction() on Python 3.14. Remove once fastapi is
    ; bumped past 0.141.1 (measured to clear it) -- that bump also requires
    ; renaming status.HTTP_422_UNPROCESSABLE_ENTITY to
    ; HTTP_422_UNPROCESSABLE_CONTENT in app/main.py, since starlette >=1.6.0
    ; deprecates the old constant.
    ignore:'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead:DeprecationWarning:fastapi\.routing
    ; starlette 0.41.3's is_async_callable() helper hits the same deprecated
    ; asyncio.iscoroutinefunction() call as above, from a different module.
    ; Removable under the same fastapi/starlette bump as the entry above.
    ignore:'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead:DeprecationWarning:starlette\._utils
    ; pytest-asyncio 0.25.2's event-loop-policy fixtures call the deprecated
    ; asyncio.get_event_loop_policy()/set_event_loop_policy() on Python 3.14.
    ; Removable once pytest-asyncio is bumped to a 1.x release.
    ignore:'asyncio\.(get|set)_event_loop_policy' is deprecated and slated for removal in Python 3\.16:DeprecationWarning:pytest_asyncio\.plugin
