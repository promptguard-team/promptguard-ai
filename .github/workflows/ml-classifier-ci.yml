name: ML Classifier CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'ml-classifier/**'
      - '.github/workflows/ml-classifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './ml-classifier'

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            ./ml-classifier/requirements.txt
            ./ml-classifier/requirements-dev.txt

      - name: Step 1 - Installing Dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Step 2 - Code Quality (Linters and Formatters)
        run: |
          ruff check app/ tests/ scripts/
          ruff format --check app/ tests/ scripts/

      - name: Step 3 - Unit Tests
        run: pytest

      - name: Step 4 - DevSecOps Security (SAST)
        run: |
          pip install bandit
          bandit -r app/

      - name: Step 5 - Secret Detection
        run: |
          pip install detect-secrets
          detect-secrets scan > secrets-report.json
          if [ "$(jq '.results | length' secrets-report.json)" -gt 0 ]; then
            echo "❌ CRITICAL: Potential secrets have been detected in the Python code!"
            cat secrets-report.json
            exit 1
          else
            echo "✅ Scan complete. No leaks detected."
          fi


  build-and-scan:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Build Local Image for Security Audit
        working-directory: ./ml-classifier
        run: |
          docker build -t ml-classifier:test .

      - name: Step 6 - Trivy Vulnerability Scanner (Container Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ml-classifier:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Step 7 - Logging in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 8 - Push Verified Image to GHCR
        working-directory: ./ml-classifier
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/ml-classifier
          IMAGE_BASE=$(echo $IMAGE_BASE | tr '[A-Z]' '[a-z]')
          SHORT_SHA=${GITHUB_SHA::7}

          docker tag ml-classifier:test $IMAGE_BASE:latest
          docker tag ml-classifier:test $IMAGE_BASE:$SHORT_SHA

          docker push $IMAGE_BASE:latest
          docker push $IMAGE_BASE:$SHORT_SHA


  release:
    name: Trigger Release
    needs: build-and-scan
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-release.yml
    with:
      app_name: 'ml-classifier'
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body }}
